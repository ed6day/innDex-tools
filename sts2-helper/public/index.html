<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STS2 Helper</title>
  <style>
    :root {
      --bg:      #0b0d14;
      --surface: #13161f;
      --panel:   #191c28;
      --panel2:  #1f2336;
      --border:  #2a2f45;
      --text:    #dde3f0;
      --muted:   #5a6380;
      --accent:  #7c83f5;
      --good:    #4ade80;
      --warn:    #fbbf24;
      --bad:     #f87171;
      --atk:     #f87171;
      --def:     #60a5fa;
      --pow:     #c084fc;
      --skl:     #34d399;
      --r: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }

    /* ── Top bar ── */
    .topbar {
      height: 48px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: -0.4px; color: var(--text); }
    .logo span { color: var(--accent); }
    .topbar-meta { font-size: 11px; color: var(--muted); }

    .conn {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto;
      padding: 4px 12px; border-radius: 999px;
      background: var(--panel2); border: 1px solid var(--border);
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
    .conn-dot.on  { background: var(--good); }
    .conn-dot.mid { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .tabs { display: flex; gap: 1px; margin-left: 16px; }
    .tab {
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      color: var(--muted); cursor: pointer; border-radius: var(--r) var(--r) 0 0;
      border: 1px solid transparent; border-bottom: none;
      transition: color .15s, background .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }

    /* ── Shell ── */
    .shell { display: flex; flex-direction: column; height: 100vh; }
    .body  { flex: 1; overflow: hidden; display: flex; }

    .pane { display: none; flex: 1; overflow: hidden; }
    .pane.active { display: flex; }

    /* ── Live pane: 3-col grid ── */
    #livePaneGrid {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1fr 300px;
      grid-template-rows: 1fr 1fr;
      gap: 10px; padding: 10px;
      overflow: hidden;
    }

    /* ── Panels ── */
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden;
    }
    .ph {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    }
    .ph-right { margin-left: auto; font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; }
    .pb { flex: 1; overflow-y: auto; padding: 10px; }

    /* ── Hand ── */
    .hand-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .card-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--panel2); font-size: 12px; font-weight: 600; cursor: default;
    }
    .card-chip.attack  { border-color: #f87171; color: #fca5a5; }
    .card-chip.skill   { border-color: #34d399; color: #6ee7b7; }
    .card-chip.power   { border-color: #c084fc; color: #d8b4fe; }
    .card-chip.curse   { border-color: #f87171; color: #fca5a5; opacity:.6; }
    .card-chip.dim     { opacity: .38; }
    .cost              { font-size: 10px; opacity: .65; }
    .val               { font-size: 10px; opacity: .75; }

    /* ── Stats list ── */
    .srow {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .srow:last-child { border-bottom: none; }
    .slabel { color: var(--muted); }
    .sval { font-weight: 700; }
    .sval.g { color: var(--good); }
    .sval.w { color: var(--warn); }
    .sval.b { color: var(--bad); }
    .sval.a { color: var(--atk); }
    .sval.d { color: var(--def); }

    /* ── Deficit bar ── */
    .deficit {
      margin: 8px 0 2px; padding: 7px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 700; text-align: center;
    }
    .deficit.g { background: rgba(74,222,128,.1);  color: var(--good); border: 1px solid rgba(74,222,128,.25); }
    .deficit.w { background: rgba(251,191,36,.1);  color: var(--warn); border: 1px solid rgba(251,191,36,.25); }
    .deficit.b { background: rgba(248,113,113,.1); color: var(--bad);  border: 1px solid rgba(248,113,113,.25); }

    /* ── Enemies ── */
    .enemy {
      padding: 9px 10px; border-radius: 8px;
      background: var(--panel2); border: 1px solid var(--border); margin-bottom: 7px;
    }
    .enemy:last-child { margin-bottom: 0; }
    .ename { font-weight: 700; font-size: 13px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: baseline; }
    .ehp   { font-size: 11px; font-weight: 400; color: var(--muted); }
    .hpbar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .hpfill { height: 100%; border-radius: 3px; transition: width .3s; }
    .intent { font-size: 12px; font-weight: 600; }
    .intent.a { color: var(--atk); }
    .intent.d { color: var(--def); }
    .intent.b { color: var(--pow); }
    .intent.u { color: var(--muted); }
    .pips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
    .pip {
      padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 700;
      background: rgba(192,132,252,.12); color: var(--pow); border: 1px solid rgba(192,132,252,.25);
    }

    /* ── Prob bars ── */
    .prob-row {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 11px;
    }
    .prob-row:last-child { border-bottom: none; }
    .pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pcnt  { color: var(--muted); min-width: 22px; text-align: right; font-size: 10px; }
    .pbars { display: flex; gap: 2px; }
    .pbar  { width: 34px; }
    .pbar-bg { height: 12px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .pbar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
    .pbar-fill.g { background: var(--good); }
    .pbar-fill.w { background: var(--warn); }
    .pbar-fill.b { background: var(--bad); }
    .pbar-lbl { font-size: 9px; color: var(--muted); text-align: center; margin-top: 1px; }

    /* ── Status ── */
    .sec-hdr { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 0 4px; }
    .relic-list { display: flex; flex-wrap: wrap; gap: 3px; }
    .relic-pill {
      padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600;
      background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    }
    .relic-pill.hot { background: rgba(192,132,252,.15); color: #d8b4fe; border-color: rgba(192,132,252,.4); }

    /* ── Event log ── */
    #logPanel { grid-row: 1 / 3; grid-column: 3; }
    .log-row { padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    .log-row:last-child { border-bottom: none; }
    .log-time  { color: var(--muted); font-size: 10px; margin-right: 5px; }
    .log-event { color: var(--accent); font-weight: 600; }

    /* ── Runs pane ── */
    #runPane > div { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .run-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .ff { display: flex; flex-direction: column; gap: 3px; }
    .ff label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .ff select, .ff input {
      padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--panel); color: var(--text); font-size: 12px; outline: none;
    }
    .ff select:focus, .ff input:focus { border-color: var(--accent); }
    .btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; align-self: flex-end; }
    .btn-p { background: var(--accent); color: #fff; }
    .runs-wrap { overflow-x: auto; }
    .rt { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rt th { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .rt td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .rt tr:hover td { background: var(--panel2); }
    .ob { padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .ob.win   { background: rgba(74,222,128,.12); color: var(--good); }
    .ob.death { background: rgba(248,113,113,.12); color: var(--bad); }
    .ob.abandoned { background: rgba(90,99,128,.15); color: var(--muted); }
    .pag { display: flex; gap: 5px; justify-content: center; }
    .pag-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .pag-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Empty state ── */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; color: var(--muted); }
    .empty .big { font-size: 32px; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="logo">STS2 <span>Helper</span></div>
    <div class="topbar-meta" id="floorMeta"></div>
    <div class="tabs">
      <div class="tab active" data-tab="live">Live</div>
      <div class="tab" data-tab="runs">History</div>
    </div>
    <button class="btn" id="demoBtn" onclick="toggleDemo()" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;font-size:11px;font-weight:700;border-radius:999px;cursor:pointer;">Demo</button>
    <div class="conn" id="connBadge" onclick="reconnect()" title="Click to reconnect">
      <div class="conn-dot mid" id="connDot"></div>
      <span id="connTxt">Connecting</span>
    </div>
  </div>

  <div class="body">

    <!-- Live tab -->
    <div class="pane active" id="livePane">
      <div id="livePaneGrid">

        <div class="panel" style="grid-column:1;grid-row:1;">
          <div class="ph">Hand <span class="ph-right" id="handCount"></span></div>
          <div class="pb">
            <div id="handGrid" class="hand-grid"></div>
            <div id="handStats" style="margin-top:10px;"></div>
          </div>
        </div>

        <div class="panel" style="grid-column:2;grid-row:1;">
          <div class="ph">Enemies <span class="ph-right" id="incomingBadge" style="color:var(--atk);"></span></div>
          <div class="pb" id="enemyPanel">
            <div class="empty"><div class="big">&#9876;</div><div>Waiting for game state</div></div>
          </div>
        </div>

        <div class="panel" id="logPanel">
          <div class="ph">Event Log</div>
          <div class="pb" id="eventLog">
            <div class="empty"><div>No events yet</div></div>
          </div>
        </div>

        <div class="panel" style="grid-column:1;grid-row:2;">
          <div class="ph">Draw Probability <span class="ph-right muted" id="drawCount" style="color:var(--muted);"></span></div>
          <div class="pb" id="drawPanel">
            <div class="empty"><div>Waiting for draw pile</div></div>
          </div>
        </div>

        <div class="panel" style="grid-column:2;grid-row:2;">
          <div class="ph">Status &amp; Relics</div>
          <div class="pb" id="statusPanel">
            <div class="empty"><div>Waiting for game state</div></div>
          </div>
        </div>

      </div>
    </div>

    <!-- History tab -->
    <div class="pane" id="runsPane">
      <div>
        <div class="panel">
          <div class="ph">Run History</div>
          <div class="pb">
            <div class="run-filters" style="margin-bottom:12px;">
              <div class="ff">
                <label>Character</label>
                <select id="fChar">
                  <option value="">All</option>
                  <option>Ironclad</option><option>Silent</option>
                  <option>Defect</option><option>Watcher</option>
                </select>
              </div>
              <div class="ff">
                <label>Outcome</label>
                <select id="fOutcome">
                  <option value="">All</option>
                  <option value="win">Win</option>
                  <option value="death">Death</option>
                  <option value="abandoned">Abandoned</option>
                </select>
              </div>
              <div class="ff">
                <label>Ascension</label>
                <input id="fAsc" type="number" min="0" max="20" placeholder="Any" style="width:70px;" />
              </div>
              <button class="btn btn-p" onclick="loadRuns(1)">Search</button>
            </div>
            <div class="runs-wrap">
              <table class="rt">
                <thead><tr>
                  <th>Character</th><th>Asc</th><th>Floor</th>
                  <th>Score</th><th>Outcome</th><th>Date</th>
                </tr></thead>
                <tbody id="runsBody">
                  <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">Search to load runs</td></tr>
                </tbody>
              </table>
            </div>
            <div id="runsPag" class="pag" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── WebSocket ──────────────────────────────────────────────────────────────────

let ws, reconnTimer;

function connect() {
  clearTimeout(reconnTimer);
  setConn('mid', 'Connecting');
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen    = () => setConn('on', 'Connected');
  ws.onclose   = () => { setConn('off', 'Disconnected'); reconnTimer = setTimeout(connect, 3000); };
  ws.onerror   = () => ws.close();
  ws.onmessage = ({ data }) => {
    try { const p = JSON.parse(data); renderLive(p); logEvent(p.eventType, p.timestamp); }
    catch {}
  };
}

function reconnect() {
  if (ws) { ws.onclose = null; ws.close(); }
  clearTimeout(reconnTimer);
  connect();
}

function setConn(state, label) {
  const dot = document.getElementById('connDot');
  dot.className = 'conn-dot' + (state === 'on' ? ' on' : state === 'mid' ? ' mid' : '');
  document.getElementById('connTxt').textContent = label;
}

connect();

// ── Tabs ───────────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab, .pane').forEach(el => el.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.tab + 'Pane').classList.add('active');
  if (t.dataset.tab === 'runs') loadRuns(1);
}));

// ── Live rendering ─────────────────────────────────────────────────────────────

function renderLive(payload) {
  const s = payload.state;
  if (!s) return;
  document.getElementById('floorMeta').textContent =
    s.character ? `${s.character} | Floor ${s.floorNumber ?? '?'} | T${s.turnNumber ?? 0}` : '';
  renderHand(s);
  renderEnemies(s);
  renderDraw(s);
  renderStatus(s);
}

// ── Hand ───────────────────────────────────────────────────────────────────────

function renderHand(s) {
  const hand = s.hand || [];
  const str  = (s.powers && s.powers['Strength'])  || 0;
  const dex  = (s.powers && s.powers['Dexterity'])  || 0;
  const weak = (s.powers && s.powers['Weak'])        || 0;
  const energy = s.energy ?? 3;

  document.getElementById('handCount').textContent = hand.length + ' cards';

  const grid = document.getElementById('handGrid');
  grid.innerHTML = '';

  if (!hand.length) {
    grid.innerHTML = '<div class="empty" style="height:60px;"><div>No cards in hand</div></div>';
  } else {
    hand.forEach(c => {
      const playable = c.cost !== -1 && c.cost <= energy;
      const dmg = c.type === 'Attack' ? Math.floor((c.damage + str) * (weak > 0 ? 0.75 : 1)) : 0;
      const blk = (c.type === 'Skill' || (c.type === 'Attack' && c.block > 0))
                  ? Math.floor(c.block + dex) : 0;
      const chip = document.createElement('div');
      chip.className = 'card-chip ' + (c.type||'').toLowerCase() + (playable ? '' : ' dim');
      chip.title = `${c.type}${c.upgraded ? '+' : ''} | cost ${c.cost === -1 ? 'X' : c.cost}`;
      chip.innerHTML =
        `<span class="cost">[${c.cost === -1 ? 'X' : c.cost}]</span>${esc(c.name)}` +
        (dmg > 0 ? ` <span class="val">&#9876;${dmg}</span>` : '') +
        (blk > 0 ? ` <span class="val">&#9632;${blk}</span>` : '');
      grid.appendChild(chip);
    });
  }

  const atkTotal = hand.filter(c => c.type === 'Attack')
                       .reduce((s, c) => s + Math.floor((c.damage + str) * (weak > 0 ? 0.75 : 1)), 0);
  const blkTotal = hand.reduce((s, c) => {
    if (c.type === 'Skill' || c.block > 0) return s + Math.floor(c.block + dex);
    return s;
  }, 0);
  const costTotal  = hand.filter(c => c.cost >= 0).reduce((s, c) => s + c.cost, 0);
  const playable   = hand.filter(c => c.cost !== -1 && c.cost <= energy).length;
  const vulnerable = (s.powers && s.powers['Vulnerable']) || 0;
  const incoming   = (s.enemies || []).filter(e => e.intentType === 'Attack')
                     .reduce((sum, e) => sum + Math.floor(e.intentValue * (vulnerable > 0 ? 1.5 : 1)), 0);
  const surplus    = (s.block || 0) + blkTotal - incoming;

  const stats = document.getElementById('handStats');
  stats.innerHTML =
    row('Attack damage', atkTotal, 'a') +
    row('Block potential', blkTotal, 'd') +
    row('Energy cost', `${costTotal} / ${energy}`) +
    row('Playable', `${playable} / ${hand.length}`) +
    (incoming > 0 ? `<div class="deficit ${surplus >= 0 ? 'g' : surplus >= -5 ? 'w' : 'b'}">
      ${surplus >= 0 ? 'Block surplus +' + surplus : 'Block deficit ' + Math.abs(surplus)} vs ${incoming} incoming
    </div>` : '');
}

function row(label, val, cls) {
  return `<div class="srow"><span class="slabel">${label}</span><span class="sval${cls?' '+cls:''}">${val}</span></div>`;
}

// ── Enemies ────────────────────────────────────────────────────────────────────

function renderEnemies(s) {
  const enemies = s.enemies || [];
  const vuln    = (s.powers && s.powers['Vulnerable']) || 0;
  const panel   = document.getElementById('enemyPanel');

  if (!enemies.length) {
    panel.innerHTML = '<div class="empty"><div>No enemies</div></div>';
    document.getElementById('incomingBadge').textContent = '';
    return;
  }

  let totalIncoming = 0;
  panel.innerHTML = enemies.map(e => {
    const pct = e.maxHp > 0 ? (e.currentHp / e.maxHp * 100).toFixed(1) : 0;
    const barColor = pct > 60 ? 'var(--good)' : pct > 30 ? 'var(--warn)' : 'var(--bad)';
    let cls = 'u', txt = 'Unknown';
    if (e.intentType === 'Attack') {
      const dmg = Math.floor(e.intentValue * (vuln > 0 ? 1.5 : 1));
      cls = 'a';
      txt = `Attack ${dmg}` + (vuln > 0 ? ` <span style="font-size:10px;opacity:.6;">(${e.intentValue}x1.5)</span>` : '');
      totalIncoming += dmg;
    } else if (e.intentType === 'Defend' || e.intentType === 'Block') {
      cls = 'd'; txt = `Defend ${e.intentValue > 0 ? e.intentValue : ''}`.trim();
    } else if (e.intentType === 'Buff' || e.intentType === 'Debuff') {
      cls = 'b'; txt = e.intentType;
    }
    const pows = e.powers && typeof e.powers === 'object'
      ? Object.entries(e.powers).map(([k,v]) => `<span class="pip">${esc(k)} ${v}</span>`).join('') : '';
    return `<div class="enemy">
      <div class="ename">${esc(e.name)} <span class="ehp">${e.currentHp}/${e.maxHp}</span></div>
      <div class="hpbar"><div class="hpfill" style="width:${pct}%;background:${barColor};"></div></div>
      <div class="intent ${cls}">${txt}</div>
      ${pows ? `<div class="pips">${pows}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('incomingBadge').textContent = totalIncoming > 0 ? `${totalIncoming} incoming` : '';
}

// ── Draw probability ───────────────────────────────────────────────────────────

function comb(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}
function probGte1(N, K, n) {
  if (!K || !N) return 0;
  if (n >= N) return 1;
  return 1 - comb(N - K, n) / comb(N, n);
}

function renderDraw(s) {
  const pile = s.drawPile || [];
  document.getElementById('drawCount').textContent = pile.length + ' in pile';
  const panel = document.getElementById('drawPanel');
  if (!pile.length) {
    panel.innerHTML = '<div class="empty"><div>Draw pile empty</div></div>';
    return;
  }
  const counts = {};
  pile.forEach(c => counts[c.name] = (counts[c.name] || 0) + 1);
  const N = pile.length;
  panel.innerHTML = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name, K]) => {
    const p3 = probGte1(N, K, 3), p5 = probGte1(N, K, 5), p7 = probGte1(N, K, 7);
    const bc = p => p >= .7 ? 'g' : p >= .4 ? 'w' : 'b';
    const bar = (p, l) =>
      `<div class="pbar"><div class="pbar-bg"><div class="pbar-fill ${bc(p)}" style="width:${(p*100).toFixed(0)}%"></div></div>
       <div class="pbar-lbl">${l} ${(p*100).toFixed(0)}%</div></div>`;
    return `<div class="prob-row">
      <span class="pname">${esc(name)}</span>
      <span class="pcnt">x${K}</span>
      <div class="pbars">${bar(p3,'3')}${bar(p5,'5')}${bar(p7,'7')}</div>
    </div>`;
  }).join('');
}

// ── Status & relics ────────────────────────────────────────────────────────────

const RELIC_TRIGGERS = {
  'Pen Nib':        s => (s.hand||[]).some(c => c.type==='Attack'),
  'Bag of Marbles': s => (s.enemies||[]).some(e => e.intentType==='Attack'),
  'Art of War':     s => !(s.hand||[]).some(c => c.type==='Attack'),
};

function renderStatus(s) {
  const panel  = document.getElementById('statusPanel');
  const powers = s.powers || {};
  const relics = s.relics  || [];
  const hpPct  = s.playerMaxHp > 0 ? s.playerHp / s.playerMaxHp * 100 : 0;
  const hpCls  = hpPct > 60 ? 'g' : hpPct > 30 ? 'w' : 'b';
  const active = new Set(relics.filter(r => RELIC_TRIGGERS[r] && RELIC_TRIGGERS[r](s)));

  let html =
    row('Player HP', `${s.playerHp ?? '?'} / ${s.playerMaxHp ?? '?'}`, hpCls) +
    row('Block',     s.block ?? 0, 'd') +
    row('Energy',    `${s.energy ?? '?'} / ${s.maxEnergy ?? '?'}`);

  const powEntries = Object.entries(powers);
  if (powEntries.length) {
    html += `<div class="sec-hdr">Powers</div><div class="pips">` +
      powEntries.map(([k,v]) => `<span class="pip">${esc(k)} ${v>0?'+':''}${v}</span>`).join('') +
      `</div>`;
  }

  if (relics.length) {
    const hotCount = active.size;
    html += `<div class="sec-hdr">Relics ${hotCount>0?`<span style="color:var(--warn);">(${hotCount} active)</span>`:''}</div>
      <div class="relic-list">` +
      relics.map(r => `<span class="relic-pill${active.has(r)?' hot':''}">${esc(r)}</span>`).join('') +
      `</div>`;
  }

  panel.innerHTML = html || '<div class="empty"><div>Waiting</div></div>';
}

// ── Event log ──────────────────────────────────────────────────────────────────

const logBuffer = [];

function logEvent(type, ts) {
  logBuffer.unshift({ type, ts });
  if (logBuffer.length > 40) logBuffer.pop();
  const el = document.getElementById('eventLog');
  el.innerHTML = logBuffer.map(e => {
    const t = new Date(e.ts).toLocaleTimeString('en-GB', { hour12: false });
    return `<div class="log-row"><span class="log-time">${t}</span><span class="log-event">${esc(e.type)}</span></div>`;
  }).join('');
}

// ── Run history ────────────────────────────────────────────────────────────────

let curPage = 1;

async function loadRuns(page) {
  curPage = page;
  const params = new URLSearchParams({ page, pageSize: 20 });
  const v = (id) => document.getElementById(id).value;
  if (v('fChar'))    params.set('character', v('fChar'));
  if (v('fOutcome')) params.set('outcome',   v('fOutcome'));
  if (v('fAsc'))     params.set('ascension', v('fAsc'));

  const tbody = document.getElementById('runsBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px;">Loading...</td></tr>';

  try {
    const { rows, total, pageSize } = await fetch('/api/runs?' + params).then(r => r.json());
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px;">No runs found</td></tr>';
      document.getElementById('runsPag').innerHTML = '';
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const oc = r.outcome === 'win' ? 'win' : r.outcome === 'death' ? 'death' : 'abandoned';
      return `<tr>
        <td>${esc(r.character||'?')}</td>
        <td>${r.ascension_level??'?'}</td>
        <td>${r.floor_reached??'?'}</td>
        <td>${r.score??'?'}</td>
        <td><span class="ob ${oc}">${esc(r.outcome||'?')}</span></td>
        <td>${(r.ended_at||'').slice(0,10)||'?'}</td>
      </tr>`;
    }).join('');

    const pages = Math.ceil(total / pageSize);
    const pag = document.getElementById('runsPag');
    pag.innerHTML = '';
    for (let p = 1; p <= pages; p++) {
      const b = document.createElement('button');
      b.textContent = p;
      b.className = 'pag-btn' + (p === curPage ? ' on' : '');
      b.onclick = () => loadRuns(p);
      pag.appendChild(b);
    }
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--bad);padding:18px;">${esc(err.message)}</td></tr>`;
  }
}

let demoIdx = 0;

function toggleDemo() {
  demoActive = !demoActive;
  const btn = document.getElementById('demoBtn');
  if (demoActive) {
    btn.style.background    = 'rgba(124,131,245,.2)';
    btn.style.borderColor   = 'var(--accent)';
    btn.style.color         = 'var(--accent)';
    btn.textContent         = 'Demo ON';
    demoIdx = 0;
    runDemoTick();
  } else {
    btn.style.background  = 'var(--panel2)';
    btn.style.borderColor = 'var(--border)';
    btn.style.color       = 'var(--muted)';
    btn.textContent       = 'Demo';
    clearTimeout(demoTimer);
  }
}

function runDemoTick() {
  if (!demoActive) return;
  const payload = { ...DEMO_STATES[demoIdx % DEMO_STATES.length], timestamp: Date.now() };
  renderLive(payload);
  logEvent(payload.eventType, payload.timestamp);
  demoIdx++;
  demoTimer = setTimeout(runDemoTick, 3000);
}
